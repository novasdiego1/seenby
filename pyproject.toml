[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seenby"
version = "0.2.0"
description = "Check whether a comment you posted is visible to others, not just accepted"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "novasdiego1"}]
keywords = ["ai agents", "moderation", "spam", "visibility", "verification", "read-back"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Monitoring",
]

[project.scripts]
seenby = "seenby.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
